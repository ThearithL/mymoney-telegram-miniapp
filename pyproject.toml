[project]
name = "mymoney-miniapp"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Flask>=3.1,<4",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
  "Pillow>=11,<13",
  "qrcode[pil]>=7.4,<9",
]

[tool.vercel]
entrypoint = "wsgi:app"

[tool.vercel.scripts]
build = "python scripts/vercel_build.py"
