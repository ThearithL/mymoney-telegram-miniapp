services:
  - type: web
    name: mymoney-miniapp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: BOT_TOKEN
        sync: false
      - key: APP_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ALLOWED_USER_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
