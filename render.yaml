services:
  - type: web
    name: mymoney-miniapp
    runtime: python
    buildCommand: bash scripts/render-build.sh
    startCommand: python scripts/render_start.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: BOT_TOKEN
        sync: false
      - key: APP_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_USER_ID
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ALLOWED_USER_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
